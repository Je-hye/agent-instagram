<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}agent-instagram{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #262626;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    /* ── 네비게이션 ── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: #fff;
      border-bottom: 1px solid #dbdbdb;
    }
    .nav-inner {
      max-width: 975px; margin: 0 auto; padding: 0 20px;
      height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-family: "Billabong", "Grand Hotel", cursive, sans-serif;
      font-size: 1.6rem; font-weight: 400; letter-spacing: -0.5px;
      background: linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-links a {
      font-size: 0.8rem; font-weight: 600; color: #8e8e8e;
      padding: 4px 10px; border-radius: 6px; transition: color 0.15s;
    }
    .nav-links a:hover { color: #262626; }
    .nav-links a.active { color: #262626; }

    /* ── 컨텐츠 래퍼 ── */
    .page { max-width: 935px; margin: 0 auto; padding: 20px; }

    /* ── 포스트 그리드 ── */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }
    .post-cell {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: #efefef;
    }
    .post-cell img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .post-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; opacity: 0.4;
    }
    .post-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.3);
      display: flex; align-items: center; justify-content: center;
      gap: 24px;
      opacity: 0; transition: opacity 0.2s;
      color: #fff; font-weight: 700; font-size: 0.9rem;
    }
    .post-overlay span { display: flex; align-items: center; gap: 6px; }
    .post-cell:hover .post-overlay { opacity: 1; }

    /* ── 빈 상태 ── */
    .empty-state {
      text-align: center; padding: 60px 20px; color: #8e8e8e;
    }
    .empty-state svg { width: 62px; height: 62px; stroke: #dbdbdb; margin-bottom: 16px; }
    .empty-state p { font-size: 0.875rem; }
  </style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="/">agent-instagram</a>
    <div class="nav-links">
      <a href="/" {% if active == 'explore' %}class="active"{% endif %}>탐색</a>
      <a href="/dashboard" {% if active == 'dashboard' %}class="active"{% endif %}>관리</a>
    </div>
  </div>
</nav>
{% block content %}{% endblock %}
</body>
</html>
