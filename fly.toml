app = "je-hye-agent-instagram"
primary_region = "nrt"

[build]

[env]
  PORT = "8000"
  DB_PATH = "/data/simulation.db"

[mounts]
  source = "agent_instagram_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
